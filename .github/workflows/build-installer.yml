name: Build Windows installer

# Builds the packaged app and the installer on a Windows runner. When the
# signing secrets are present the exe and the setup are signed; without them
# the build still runs and a release says in its notes that the installer is
# unsigned. A `v*` tag publishes the setup exe as a GitHub Release asset;
# branches and pull requests keep it as a workflow artifact only. A release tag
# must name the same version as APP_VERSION in desktop.py, so the exe in a
# release is the version it says.
#
# Repository secrets:
#   FREEBUFF_SIGN_PFX_BASE64       the .pfx file, base64-encoded
#   FREEBUFF_SIGN_PFX_PASSWORD     its password
#   SIGNPATH_API_TOKEN             SignPath API token with submitter rights
#
# Repository variables (SignPath Foundation, free for open source):
#   SIGNPATH_ORGANIZATION_ID       SignPath organization id (a GUID)
#   SIGNPATH_PROJECT_SLUG          project slug, e.g. dicteer
#   SIGNPATH_POLICY_SLUG           signing policy slug, e.g. release-signing
#   SIGNPATH_EXE_CONFIG            artifact configuration for Dicteer.exe
#   SIGNPATH_SETUP_CONFIG          artifact configuration for the setup exe
#
# SignPath signing runs only for `v*` tags, because every request waits for a
# maintainer's approval. Without the token the workflow builds unsigned.
#
# Create the first with (PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\certs\freebuff.pfx"))
# Never commit the .pfx itself. Without the secrets the workflow still builds,
# but the artifact is unsigned and Windows will call it an unknown publisher.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    # The release job says in its notes whether Windows will trust the exe.
    outputs:
      signed: ${{ steps.signature.outputs.signed }}

    env:
      SIGN_PFX_BASE64: ${{ secrets.FREEBUFF_SIGN_PFX_BASE64 }}
      FREEBUFF_SIGN_PFX_PASSWORD: ${{ secrets.FREEBUFF_SIGN_PFX_PASSWORD }}
      # Free code signing for open source through SignPath Foundation. The
      # repository is signed in two passes (app exe, then the installer that
      # embeds it) and only for tags, because every request needs a maintainer
      # to approve it. Empty values mean the build stays unsigned, as before.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
      SIGNPATH_EXE_CONFIG: ${{ vars.SIGNPATH_EXE_CONFIG }}
      SIGNPATH_SETUP_CONFIG: ${{ vars.SIGNPATH_SETUP_CONFIG }}
      # One flag for all five values, so a half-filled configuration falls
      # back to an unsigned build instead of failing at the signing step.
      SIGNPATH_READY: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_POLICY_SLUG != '' && vars.SIGNPATH_EXE_CONFIG != '' && vars.SIGNPATH_SETUP_CONFIG != '' }}

    # Reading the workflow's own artifacts (what SignPath's action does) needs
    # actions: read on top of the repository contents.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A release tag names the version that is inside the exe, so it has to
      # match APP_VERSION; otherwise a v1.7 tag could ship a 1.6 binary.
      - name: Check the tag matches APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag and APP_VERSION may be written differently (v1.6, v1.6.0,
          # v1.6.0.0, v1.6.0-beta.1), so compare them as numbers.
          function Get-VersionKey([string]$value, [string]$label) {
            $core = ($value -replace '^[vV]', '') -replace '[-+].*$', ''
            $parts = $core.Split('.')
            if ($parts.Count -lt 1 -or $parts.Count -gt 4) {
              throw "$label '$value' is not a version like 1.6 or 1.6.0.1."
            }
            $numbers = @()
            foreach ($part in $parts) {
              if ($part -notmatch '^\d{1,5}$') {
                throw "$label '$value' has a non-numeric part '$part'."
              }
              $numbers += [int]$part
            }
            while ($numbers.Count -lt 4) { $numbers += 0 }
            return ($numbers -join '.')
          }

          $match = Select-String -Path 'desktop.py' -Pattern '^APP_VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'APP_VERSION not found in desktop.py.' }
          $appVersion = $match.Matches[0].Groups[1].Value

          $tagKey = Get-VersionKey $env:TAG 'tag'
          $appKey = Get-VersionKey $appVersion 'APP_VERSION in desktop.py'
          if ($tagKey -ne $appKey) {
            throw "Tag $($env:TAG) is version $tagKey, but APP_VERSION in desktop.py is $appVersion ($appKey). Bump APP_VERSION (and installer\version_info.txt, installer\Dicteer.nsi), commit, then tag again."
          }
          "Tag $($env:TAG) matches APP_VERSION $appVersion." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Tag $($env:TAG) matches APP_VERSION $appVersion."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The exe's Windows version resource repeats APP_VERSION by hand; a stale
      # version_info.txt would build an exe labelled with an old version.
      - name: Check version metadata
        run: python installer/version.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Two self-tests run real Whisper models, and a fresh runner has none. The
      # three models are about half a gigabyte, so they are cached: the first tag
      # downloads them, every later tag restores them. Bump the key when the
      # tested models change.
      - name: Restore the Whisper models
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-models-${{ runner.os }}-small-base-base.en-v1

      # test_dutch checks the configuration the installer ships, and skips when
      # it is not Dutch. A runner has no configuration at all, so the delivered
      # one is copied in and the Dutch path gets exercised too.
      - name: Seed the shipped Dutch configuration
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Copy-Item installer\default-config.json config.json -Force

      - name: Byte-compile
        shell: pwsh
        run: |
          $files = Get-ChildItem -File -Path . -Include *.py, *.pyw
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($file.Name) does not compile" }
          }
          Write-Host "Compiled $($files.Count) files."

      - name: Write the signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'freebuff-signing.pfx'
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          [IO.File]::WriteAllBytes($path, $bytes)
          "FREEBUFF_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing certificate written ($($bytes.Length) bytes)."

      # A tag runs the whole suite, models included: they come from the cache
      # above, so the download is a one-time cost. A push to main runs the same
      # suite minus the three model checks, which keeps ordinary builds quick.
      # Either way a stale version number, licence notice or picker label stops
      # the build instead of reaching an installer.
      - name: Build the app and installer (local certificate)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          if (-not $env:FREEBUFF_SIGN_PFX_PASSWORD) {
            throw 'FREEBUFF_SIGN_PFX_BASE64 is set but FREEBUFF_SIGN_PFX_PASSWORD is missing.'
          }
          ./build-installer.ps1 -SkipTests -RequireSignature
          'SIGNED=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # SignPath signs one artifact per request, and the installer embeds the
      # app exe, so the exe is signed first and packaged afterwards. Reversing
      # that order would ship an installer holding an unsigned exe.
      - name: Build the app exe for signing
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        shell: pwsh
        run: ./build-installer.ps1 -SkipTests -ExeOnly

      - name: Upload the app exe for signing
        id: upload-exe
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-dicteer-exe
          path: dist/Dicteer/Dicteer.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the app exe with SignPath
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Use the signed app exe
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $signed = Get-ChildItem 'signed-exe' -Recurse -Filter 'Dicteer.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no Dicteer.exe.' }
          Copy-Item $signed.FullName 'dist\Dicteer\Dicteer.exe' -Force
          $check = Get-AuthenticodeSignature 'dist\Dicteer\Dicteer.exe'
          if ($check.Status -ne 'Valid') { throw "The signed app exe is not valid: $($check.Status)" }
          Write-Host "App exe signed by $($check.SignerCertificate.Subject)"

      - name: Build the installer around the signed exe
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        shell: pwsh
        run: ./build-installer.ps1 -SkipTests -InstallerOnly

      - name: Upload the installer for signing
        id: upload-setup
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-dicteer-setup
          path: dist/Dicteer-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer with SignPath
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: env.SIGN_PFX_BASE64 == '' && env.SIGNPATH_READY == 'true' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $signed = Get-ChildItem 'signed-setup' -Recurse -Filter 'Dicteer-Setup-*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no installer.' }
          $target = Get-ChildItem 'dist\Dicteer-Setup-*.exe' | Select-Object -First 1
          if (-not $target) { throw 'No installer was produced.' }
          Copy-Item $signed.FullName $target.FullName -Force
          $check = Get-AuthenticodeSignature $target.FullName
          if ($check.Status -ne 'Valid') { throw "The signed installer is not valid: $($check.Status)" }
          Write-Host "Installer signed by $($check.SignerCertificate.Subject)"
          'SIGNED=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the app and installer (no signing configured)
        if: env.SIGN_PFX_BASE64 == '' && (env.SIGNPATH_READY != 'true' || github.ref_type != 'tag')
        shell: pwsh
        run: |
          Write-Warning 'No signing configured for this build; Windows will call the installer an unknown publisher.'
          if ("${{ github.ref_type }}" -eq 'tag') {
            Write-Warning 'Publishing this tag unsigned; set the SignPath variables or the certificate secrets to publish a signed installer.'
          }
          if ("${{ github.ref_type }}" -eq 'tag' -or "${{ github.event_name }}" -eq 'workflow_dispatch') {
            ./build-installer.ps1
          } else {
            ./build-installer.ps1 -SkipModelTests
          }
          'SIGNED=false' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Record whether the build is signed
        id: signature
        shell: pwsh
        run: |
          $signed = $env:SIGNED -eq 'true'
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check the signature
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'dist\Dicteer-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer was produced.' }
          $signature = Get-AuthenticodeSignature $setup.FullName
          $exe = Get-AuthenticodeSignature 'dist\Dicteer\Dicteer.exe'

          @(
            '### Dicteer installer'
            ''
            '| File | Status | Signer | Timestamped |'
            '| --- | --- | --- | --- |'
            "| $($setup.Name) | $($signature.Status) | $($signature.SignerCertificate.Subject) | $($null -ne $signature.TimeStamperCertificate) |"
            "| Dicteer.exe | $($exe.Status) | $($exe.SignerCertificate.Subject) | $($null -ne $exe.TimeStamperCertificate) |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($env:SIGNED -eq 'true') {
            if ($signature.Status -ne 'Valid' -or $exe.Status -ne 'Valid') {
              throw "The signature is not valid: setup=$($signature.Status) exe=$($exe.Status). Check the certificate chain."
            }
            Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
          } else {
            Write-Host 'Unsigned build (no certificate secret).'
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Dicteer-Setup
          path: dist/Dicteer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # Publishing needs contents: write, which the build job deliberately lacks.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: Dicteer-Setup
          path: release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
          # This job does not check the repository out, and gh resolves the
          # repository from the working directory unless told explicitly.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release -name '*.exe' -type f | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No installer found in the build artifact." >&2
            exit 1
          fi
          printf 'Attaching: %s\n' "${assets[@]}"

          flags=(--title "Dicteer $TAG" --generate-notes)
          # --notes is prepended to the generated notes, so the downloader learns
          # about the SmartScreen prompt before they run the file.
          if [[ "$SIGNED" != 'true' ]]; then
            flags+=(--notes 'This build is **unsigned**, so Windows SmartScreen shows an unknown publisher the first time you run it. Choose **More info** then **Run anyway**. To publish a signed installer, either set the SignPath variables (`SIGNPATH_ORGANIZATION_ID`, `SIGNPATH_PROJECT_SLUG`, `SIGNPATH_POLICY_SLUG`, `SIGNPATH_EXE_CONFIG`, `SIGNPATH_SETUP_CONFIG`) plus the `SIGNPATH_API_TOKEN` secret, or add a certificate through `FREEBUFF_SIGN_PFX_BASE64` and `FREEBUFF_SIGN_PFX_PASSWORD`.')
          fi
          # v1.7.0-beta.1 and similar are published as pre-releases.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Re-running the job for the same tag replaces the asset.
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${assets[@]}" "${flags[@]}" --repo "$REPO"
          fi

      - name: Show the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # A literal block keeps the backslash continuation; folded YAML would
        # splice the expression into the --json argument.
        run: |
          gh release view "$TAG" --repo "$REPO" --json tagName,url,isPrerelease,assets \
            --jq '"\(.tagName) \(.url) prerelease=\(.isPrerelease)\n" + ([.assets[] | "\(.name) (\(.size) bytes)"] | join("\n"))'
